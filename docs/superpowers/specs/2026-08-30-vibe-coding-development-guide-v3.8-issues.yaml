audit_requirements:
  - every PRD FR-801..FR-811 maps to one or more issues and acceptance references
  - every PRD AC-801..AC-808 maps to a focused test and an integration assertion
  - all issues have input/output/error_behavior/acceptance_examples/risk_tags and exact writer/reviewer/provider/worktree/branch/allowlist
  - no old V3 authorization, plan confirmation, run, task binding or provider result is reused as current V3.8 evidence
  - visible provider capability is required but remains unverified until real runtime observation
  - no issue permits deploy, merge-to-main, external installation or system permission changes
