audit_requirements:
  - all FR-801..FR-811 and AC-801..AC-808 are mapped to issues, nodes and tests
  - hard dependencies form an acyclic graph and integration_after does not create readiness cycles
  - every node has one writer, a different reviewer, provider-managed worktree strategy and an allowlist
  - every provider task must register and verify its actual worktree/managed_root/branch/HEAD/clean/base_sha binding before first business write
  - V38-1 is the only initial ready node; V38-4 and V38-7 become ready after V38-1
  - preflight is read-only and blocks worker/provider/Git actions on mismatch or unknown
  - old V3 authorization and runtime evidence are never rebound as current V3.8 facts
  - no current artifact creates a worker, run, authorization card, commit, push, MR, merge or deploy

